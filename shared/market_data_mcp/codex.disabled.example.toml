# Candidate only. This file is not loaded by Codex.
# Generate absolute paths with `python3 manage.py print-config` from this folder.
# Keep disabled until the separate rollout checks in README.md are complete.
[mcp_servers.tradingview]
enabled = false
command = "/usr/bin/python3"
args = ["/ABSOLUTE/WORKSPACE/shared/market_data_mcp/manage.py", "serve", "tradingview"]
cwd = "/ABSOLUTE/WORKSPACE"
startup_timeout_sec = 5
tool_timeout_sec = 75

